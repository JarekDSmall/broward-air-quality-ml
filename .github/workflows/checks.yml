name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python and demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install modeling dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed demo data and asset references
        run: python scripts/check_demo.py
      - name: Check demo JavaScript syntax
        run: |
          node --check demo/dist/app.js
          node --check demo/dist/data.js
